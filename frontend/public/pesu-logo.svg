<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60" viewBox="0 0 200 60" role="img" aria-label="PES University logo">
  <defs>
    <style>
      .navy{fill:#1F3A75}
      .orange{fill:#F7941D}
      .text-main{font-family:Arial, Helvetica, sans-serif; font-weight:700; font-size:20px; fill:#1F3A75}
      .text-sub{font-family:Arial, Helvetica, sans-serif; font-weight:600; font-size:9px; fill:#1F3A75; letter-spacing:1px}
    </style>
  </defs>
  <g transform="translate(8,3)">
    <circle cx="24" cy="24" r="22" fill="#ffffff" stroke="#1F3A75" stroke-width="2" />
    <g transform="translate(24,24) scale(0.7)">
      <polygon points="0,-20 4,-6 18,-6 6,2 10,18 0,8 -10,18 -6,2 -18,-6 -4,-6" class="orange" />
      <circle r="2" class="navy" />
    </g>
  </g>
  <g transform="translate(60,14)">
    <text class="text-main">PES</text>
    <text class="text-sub" x="0" y="20">UNIVERSITY</text>
  </g>
</svg>
